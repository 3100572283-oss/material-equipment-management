{% extends "base.html" %}
{% block title %}商砼小票登记 - 物资设备管理系统{% endblock %}
{% block content %}
<div class="card shadow-sm">
    <div class="card-header bg-white d-flex justify-content-between align-items-center">
        <h5 class="mb-0"><i class="bi bi-receipt me-2"></i>商砼小票登记</h5>
        <a href="{{ url_for('concrete.index') }}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>返回列表</a>
    </div>
    <div class="card-body">
        <form method="POST" enctype="multipart/form-data">
            <div class="row g-3 mb-3">
                <div class="col-md-3">
                    <label class="form-label">小票号</label>
                    <div class="input-group">
                        <input type="text" class="form-control" name="ticket_no" value="{{ default_ticket_no }}" placeholder="留空自动生成">
                        <button type="button" class="btn btn-outline-secondary" id="genTicketNoBtn" title="重新生成">
                            <i class="bi bi-arrow-clockwise"></i>
                        </button>
                    </div>
                    <small class="text-muted">格式：CT-项目-日期-序号，可修改</small>
                </div>
                <div class="col-md-3">
                    <label class="form-label">供货单位</label>
                    <select class="form-select" name="supplier_id" id="supplierSelect">
                        <option value="">-- 请选择 --</option>
                        {% for s in suppliers %}
                        <option value="{{ s.id }}" data-name="{{ s.name }}">{{ s.name }}</option>
                        {% endfor %}
                    </select>
                    <input type="hidden" name="supplier_name" id="supplierName">
                </div>
                <div class="col-md-3">
                    <label class="form-label">关联合同</label>
                    <select class="form-select" name="contract_id" id="contractSelect" disabled>
                        <option value="">-- 请先选择供应商 --</option>
                    </select>
                    <small id="contractProgress" class="form-text" style="display:none;"></small>
                </div>
                <div class="col-md-3">
                    <label class="form-label">商砼标号</label>
                    <select class="form-select" name="material_id" id="materialSelect">
                        <option value="">-- 请选择 --</option>
                    </select>
                    <input type="hidden" name="strength_grade" id="strengthGrade">
                    <small class="text-muted">仅显示项目常用商砼物资，未找到请<a href="{{ url_for('material.index') }}" target="_blank">前往常用材料表添加</a></small>
                </div>
                <div class="col-md-3">
                    <label class="form-label">浇筑部位</label>
                    <input type="text" class="form-control" name="pour_part" placeholder="如 基础底板">
                </div>
                <div class="col-md-3">
                    <label class="form-label">关联工号</label>
                    <select class="form-select" name="work_number_id">
                        <option value="">-- 请选择 --</option>
                        {% for w in work_numbers %}
                        <option value="{{ w.id }}">{{ w.code }}{% if w.division_name %}（{{ w.division_name }}）{% endif %}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">车次</label>
                    <input type="number" class="form-control" name="vehicle_count" min="1" value="1">
                </div>
                <div class="col-md-3">
                    <label class="form-label">运输车号</label>
                    <input type="text" class="form-control" name="vehicle_no" placeholder="如 陕A12345">
                </div>
                <div class="col-md-3">
                    <label class="form-label">司机姓名</label>
                    <input type="text" class="form-control" name="driver_name" placeholder="司机">
                </div>
                <div class="col-md-3">
                    <label class="form-label">方量(m³) <span class="text-danger">*</span></label>
                    <input type="number" step="0.0001" min="0" class="form-control" name="volume" required placeholder="如 8.0">
                </div>
                <div class="col-md-3">
                    <label class="form-label">到场时间</label>
                    <input type="datetime-local" class="form-control" name="arrival_time" value="{{ now }}">
                </div>
                <div class="col-md-3">
                    <label class="form-label">坍落度</label>
                    <input type="text" class="form-control" name="slump" placeholder="如 160±20">
                </div>
                <div class="col-md-3">
                    <label class="form-label">温度</label>
                    <input type="text" class="form-control" name="temperature" placeholder="如 25℃">
                </div>
                <div class="col-md-6">
                    <label class="form-label">备注</label>
                    <input type="text" class="form-control" name="remark" placeholder="备注说明">
                </div>
                <div class="col-md-3">
                    <label class="form-label">随车照片</label>
                    <input type="file" class="form-control" name="photo" accept="image/*">
                </div>
            </div>

            <div class="form-actions">
                <a href="{{ url_for('concrete.index') }}" class="btn btn-secondary">返回</a>
                <button type="submit" class="btn btn-primary" id="submitBtn"><i class="bi bi-check-lg me-1"></i>保存</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
function updateContractProgress() {
    const contractId = document.getElementById('contractSelect').value;
    const progressEl = document.getElementById('contractProgress');
    if (!contractId) {
        progressEl.style.display = 'none';
        return;
    }
    fetch("{{ url_for('concrete.api_contract_progress') }}?contract_id=" + contractId)
        .then(r => r.json())
        .then(data => {
            if (data.success) {
                const color = data.exceeded ? '#dc3545' :
                              (data.total > 0 && data.remaining / data.total < 0.2) ? '#fd7e14' : '#6c757d';
                progressEl.style.display = 'block';
                progressEl.style.color = color;
                progressEl.textContent = `合同总量：${data.total}方 / 已供货：${data.supplied}方 / 剩余：${data.remaining}方`;
            }
        }).catch(() => { progressEl.style.display = 'none'; });
}

document.getElementById('supplierSelect').addEventListener('change', function() {
    const opt = this.options[this.selectedIndex];
    document.getElementById('supplierName').value = opt ? opt.dataset.name || '' : '';
    
    const contractSelect = document.getElementById('contractSelect');
    const progressEl = document.getElementById('contractProgress');
    progressEl.style.display = 'none';
    if (this.value) {
        contractSelect.disabled = false;
        contractSelect.innerHTML = '<option value="">加载中...</option>';
        
        fetch("{{ url_for('concrete.api_supplier_contracts') }}?supplier_id=" + this.value)
            .then(r => r.json())
            .then(data => {
                contractSelect.innerHTML = '<option value="">-- 请选择合同 --</option>';
                if (data && data.length > 0) {
                    data.forEach(function(c) {
                        const option = document.createElement('option');
                        option.value = c.id;
                        option.textContent = c.code + ' - ' + c.name;
                        contractSelect.appendChild(option);
                    });
                    
                    const lastContract = sessionStorage.getItem('last_concrete_contract_' + this.value);
                    if (lastContract) {
                        contractSelect.value = lastContract;
                        updateContractProgress();
                    }
                }
            }).catch(err => {
                contractSelect.innerHTML = '<option value="">加载失败</option>';
            });
    } else {
        contractSelect.disabled = true;
        contractSelect.innerHTML = '<option value="">-- 请先选择供应商 --</option>';
    }
});

document.getElementById('contractSelect').addEventListener('change', function() {
    const supplierId = document.getElementById('supplierSelect').value;
    if (supplierId && this.value) {
        sessionStorage.setItem('last_concrete_contract_' + supplierId, this.value);
    }
    updateContractProgress();
});

document.getElementById('genTicketNoBtn').addEventListener('click', function() {
    fetch('{{ url_for("concrete.api_gen_ticket_no") }}')
        .then(r => r.json())
        .then(data => {
            if (data.success) {
                document.querySelector('input[name="ticket_no"]').value = data.ticket_no;
            } else {
                customAlert(data.message || '生成失败');
            }
        }).catch(err => customAlert('请求失败：' + err));
});

// 提交前超量预警
document.getElementById('submitBtn').addEventListener('click', function(e) {
    const contractId = document.getElementById('contractSelect').value;
    const volume = parseFloat(document.querySelector('input[name="volume"]').value) || 0;
    if (!contractId || volume <= 0) return;  // 交由必填校验处理

    e.preventDefault();
    fetch("{{ url_for('concrete.api_contract_progress') }}?contract_id=" + contractId)
        .then(r => r.json())
        .then(data => {
            if (data.success && data.remaining - volume < 0) {
                const over = (volume - data.remaining).toFixed(2);
                const msg = `当前合同累计供货将超出合同总量，确认继续提交吗？\n\n` +
                            `合同总量：${data.total}方\n` +
                            `已供货：${data.supplied}方\n` +
                            `本次录入：${volume}方\n` +
                            `超出：${over}方`;
                if (confirm(msg)) {
                    document.querySelector('form').submit();
                }
            } else {
                document.querySelector('form').submit();
            }
        }).catch(() => {
            document.querySelector('form').submit();
        });
});

// 加载项目常用商砼物资
const materialSelect = document.getElementById('materialSelect');
function loadConcreteMaterials() {
    fetch("{{ url_for('concrete.api_project_concrete_materials') }}")
        .then(r => r.json())
        .then(data => {
            materialSelect.innerHTML = '<option value="">-- 请选择 --</option>';
            if (data && data.length > 0) {
                data.forEach(function(m) {
                    const option = document.createElement('option');
                    option.value = m.id;
                    option.dataset.spec = m.specification || '';
                    option.dataset.unit = m.unit || '';
                    option.textContent = m.name + ' - ' + (m.specification || '-') + ' - ' + (m.unit || '');
                    materialSelect.appendChild(option);
                });
                const last = sessionStorage.getItem('last_concrete_material');
                if (last) materialSelect.value = last;
            } else {
                materialSelect.innerHTML = '<option value="">-- 无可用商砼物资 --</option>';
            }
        }).catch(() => {
            materialSelect.innerHTML = '<option value="">加载失败</option>';
        });
}
materialSelect.addEventListener('change', function() {
    const opt = this.options[this.selectedIndex];
    // 从名称中提取强度等级，如 "商砼C30" -> "C30"
    const name = opt ? opt.textContent : '';
    const gradeMatch = name.match(/C\d+/);
    document.getElementById('strengthGrade').value = gradeMatch ? gradeMatch[0] : '';
    if (this.value) sessionStorage.setItem('last_concrete_material', this.value);
});
loadConcreteMaterials();
</script>
{% endblock %}
