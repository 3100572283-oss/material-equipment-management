{% extends "wizard/base_wizard.html" %}
{% block title %}欢迎使用{% endblock %}
{% block content %}
<div class="text-center py-4">
    <div class="step-icon text-primary"><i class="bi bi-hand-thumbs-up-fill"></i></div>
    <h4 class="mb-3">欢迎使用物资设备管理系统</h4>
    <p class="text-muted mb-4">
        这是系统首次启动，我们将引导您完成初始配置。<br>
        整个过程大约需要 2 分钟，请按照以下步骤操作：
    </p>
    <div class="text-start mx-auto" style="max-width: 380px;">
        <div class="d-flex align-items-center mb-3">
            <span class="badge bg-primary rounded-circle me-3" style="width:28px;height:28px;display:flex;align-items:center;justify-content:center;">1</span>
            <span>创建超级管理员账号</span>
        </div>
        <div class="d-flex align-items-center mb-3">
            <span class="badge bg-secondary rounded-circle me-3" style="width:28px;height:28px;display:flex;align-items:center;justify-content:center;">2</span>
            <span>创建部门（可选）</span>
        </div>
        <div class="d-flex align-items-center mb-3">
            <span class="badge bg-secondary rounded-circle me-3" style="width:28px;height:28px;display:flex;align-items:center;justify-content:center;">3</span>
            <span>创建项目（可选）</span>
        </div>
        <div class="d-flex align-items-center">
            <span class="badge bg-secondary rounded-circle me-3" style="width:28px;height:28px;display:flex;align-items:center;justify-content:center;">4</span>
            <span>确认配置并完成</span>
        </div>
    </div>
</div>
{% endblock %}
{% block footer %}
<div class="wizard-footer">
    <span></span>
    <form method="POST" action="{{ url_for('main.wizard_submit') }}">
        <input type="hidden" name="action" value="start">
        <button type="submit" class="btn btn-primary">
            开始配置 <i class="bi bi-arrow-right ms-1"></i>
        </button>
    </form>
</div>
{% endblock %}
