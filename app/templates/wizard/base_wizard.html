<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}系统初始化{% endblock %} - 物资设备管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #f5f7fa; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .wizard-container { max-width: 640px; width: 100%; }
        .wizard-card { box-shadow: 0 10px 40px rgba(0,0,0,0.08); border: none; border-radius: 12px; overflow: hidden; }
        .wizard-header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 30px; }
        .wizard-steps { display: flex; gap: 8px; margin-top: 16px; }
        .wizard-step { flex: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.3); }
        .wizard-step.active { background: white; }
        .wizard-body { padding: 32px; background: white; }
        .wizard-footer { padding: 16px 32px; background: #f8f9fa; border-top: 1px solid #e9ecef; display: flex; justify-content: space-between; }
        .step-icon { font-size: 48px; margin-bottom: 16px; }
        .form-label { font-weight: 500; }
    </style>
</head>
<body>
<div class="wizard-container">
    <div class="card wizard-card">
        <div class="wizard-header">
            <h4 class="mb-0"><i class="bi bi-magic me-2"></i>系统初始化向导</h4>
            <div class="wizard-steps">
                <div class="wizard-step {% if step >= '1' %}active{% endif %}"></div>
                <div class="wizard-step {% if step >= '2' %}active{% endif %}"></div>
                <div class="wizard-step {% if step >= '3' %}active{% endif %}"></div>
                <div class="wizard-step {% if step >= '4' %}active{% endif %}"></div>
                <div class="wizard-step {% if step >= '5' %}active{% endif %}"></div>
            </div>
        </div>
        <div class="wizard-body">
            {% block content %}{% endblock %}
        </div>
        {% block footer %}{% endblock %}
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
