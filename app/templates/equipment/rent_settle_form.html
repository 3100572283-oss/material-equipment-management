{% extends "base.html" %}
{% block title %}{{ '编辑' if settle else '新增' }}结算单 - 物资设备管理系统{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-10">
        <div class="card shadow-sm">
            <div class="card-header bg-white">
                <h5 class="mb-0"><i class="bi bi-receipt me-2"></i>{{ '编辑' if settle else '新增' }}结算单</h5>
            </div>
            <div class="card-body">
                <form method="POST" id="settleForm">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">租赁设备 <span class="text-danger">*</span></label>
                            <select class="form-select" name="equipment_id" id="equipmentSelect" required>
                                <option value="">-- 请选择 --</option>
                                {% for e in rent_equipments %}
                                <option value="{{ e.id }}"
                                        data-supplier-id="{{ e.supplier_id or 0 }}"
                                        data-rent-type="{{ e.rent_type or '' }}"
                                        data-unit-price="{{ e.rent_unit_price or 0 }}"
                                        {% if settle and settle.equipment_id == e.id %}selected{% endif %}>{{ e.name }}（{{ e.code }}）</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">供应商</label>
                            <input type="text" class="form-control bg-light" id="supplierName" readonly value="{{ settle.supplier.name if settle and settle.supplier else '' }}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">租赁方式</label>
                            <select class="form-select" name="rent_type" id="rentType">
                                <option value="">-- 请选择 --</option>
                                {% for label, value in rent_type_items %}
                                <option value="{{ value }}" {% if settle and settle.rent_type == value %}selected{% endif %}>{{ label }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">租赁单价（元）</label>
                            <input type="number" step="0.01" class="form-control" name="unit_price" id="unitPrice"
                                   value="{{ '%.2f'|format(settle.unit_price) if settle and settle.unit_price else '' }}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">结算期间 <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" name="settle_period" placeholder="如：2025年7月"
                                   value="{{ settle.settle_period if settle else '' }}" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">结算开始日期</label>
                            <input type="date" class="form-control" name="settle_start_date"
                                   value="{{ settle.settle_start_date.strftime('%Y-%m-%d') if settle and settle.settle_start_date else '' }}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">结算结束日期</label>
                            <input type="date" class="form-control" name="settle_end_date"
                                   value="{{ settle.settle_end_date.strftime('%Y-%m-%d') if settle and settle.settle_end_date else '' }}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">数量（台班/月/天）</label>
                            <input type="number" step="0.01" class="form-control" name="quantity" id="quantity"
                                   value="{{ settle.quantity if settle and settle.quantity else '' }}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">租赁费（元）</label>
                            <input type="text" class="form-control bg-light" id="rentAmount" readonly value="{{ '%.2f'|format(settle.rent_amount) if settle and settle.rent_amount else '0.00' }}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">其他费用（元）</label>
                            <input type="number" step="0.01" class="form-control" name="other_fee" id="otherFee"
                                   value="{{ '%.2f'|format(settle.other_fee) if settle and settle.other_fee else '' }}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">总金额（元）</label>
                            <input type="text" class="form-control bg-light fw-bold" id="totalAmount" readonly value="{{ '%.2f'|format(settle.total_amount) if settle and settle.total_amount else '0.00' }}">
                        </div>
                        <div class="col-12">
                            <label class="form-label">备注</label>
                            <textarea class="form-control" name="remark" rows="2">{{ settle.remark if settle else '' }}</textarea>
                        </div>
                    </div>
                    <div class="mt-4">
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>保存</button>
                        <a href="{{ url_for('equipment.rent_settle') }}" class="btn btn-secondary ms-2"><i class="bi bi-arrow-left me-1"></i>返回</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
(function () {
    var equipmentSelect = document.getElementById('equipmentSelect');
    var supplierName = document.getElementById('supplierName');
    var rentType = document.getElementById('rentType');
    var unitPrice = document.getElementById('unitPrice');
    var quantity = document.getElementById('quantity');
    var otherFee = document.getElementById('otherFee');
    var rentAmount = document.getElementById('rentAmount');
    var totalAmount = document.getElementById('totalAmount');

    function toNum(v) {
        var n = parseFloat(v);
        return isNaN(n) ? 0 : n;
    }

    function fillFromEquipment() {
        var opt = equipmentSelect.options[equipmentSelect.selectedIndex];
        if (!opt || !opt.value) {
            supplierName.value = '';
            return;
        }
        var supplierId = opt.getAttribute('data-supplier-id');
        var rentTypeVal = opt.getAttribute('data-rent-type');
        var unitPriceVal = opt.getAttribute('data-unit-price');
        // 通过接口获取供应商名称（避免在 option 里塞太多数据）
        if (opt.getAttribute('data-supplier-name')) {
            supplierName.value = opt.getAttribute('data-supplier-name');
        } else {
            supplierName.value = '';
            fetch('/equipment/rent_settle/api/equipment/' + opt.value)
                .then(function (r) { return r.json(); })
                .then(function (data) {
                    supplierName.value = data.supplier_name || '';
                    opt.setAttribute('data-supplier-name', data.supplier_name || '');
                }).catch(function () {});
        }
        if (rentTypeVal && !rentType.value) {
            rentType.value = rentTypeVal;
        }
        if (unitPriceVal && !unitPrice.value) {
            unitPrice.value = parseFloat(unitPriceVal).toFixed(2);
        }
        calc();
    }

    function calc() {
        var up = toNum(unitPrice.value);
        var qty = toNum(quantity.value);
        var of = toNum(otherFee.value);
        var rent = Math.round(up * qty * 100) / 100;
        var total = Math.round((rent + of) * 100) / 100;
        rentAmount.value = rent.toFixed(2);
        totalAmount.value = total.toFixed(2);
    }

    equipmentSelect.addEventListener('change', fillFromEquipment);
    [unitPrice, quantity, otherFee].forEach(function (el) {
        el.addEventListener('input', calc);
        el.addEventListener('change', calc);
    });
    // 初始化：编辑时若已有值则计算
    if (equipmentSelect.value) {
        fillFromEquipment();
    } else {
        calc();
    }
})();
</script>
{% endblock %}
