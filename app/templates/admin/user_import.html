{% extends "base.html" %}
{% block title %}批量导入用户 - 物资设备管理系统{% endblock %}
{% block content %}
<div class="card shadow-sm" style="max-width:600px;">
    <div class="card-header bg-white d-flex justify-content-between align-items-center">
        <h5 class="mb-0"><i class="bi bi-file-earmark-spreadsheet me-2"></i>批量导入用户</h5>
        <a href="{{ url_for('admin.users') }}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>返回列表</a>
    </div>
    <div class="card-body">
        <div class="alert alert-info">
            <i class="bi bi-info-circle me-2"></i>
            <strong>操作说明：</strong>
            <ol class="mb-0 mt-2">
                <li>下载导入模板，按照模板格式填写用户信息</li>
                <li>带 * 号的为必填项</li>
                <li>部门编码、角色编码请在对应管理页面查看</li>
                <li>初始密码留空则使用默认密码 123456</li>
            </ol>
        </div>

        <div class="mb-4">
            <a href="{{ url_for('admin.import_user_template') }}" class="btn btn-outline-primary">
                <i class="bi bi-download me-1"></i>下载导入模板
            </a>
        </div>

        <form method="POST" action="{{ url_for('admin.import_users') }}" enctype="multipart/form-data">
            <div class="mb-3">
                <label class="form-label">选择Excel文件 <span class="text-danger">*</span></label>
                <input type="file" class="form-control" name="file" accept=".xlsx,.xls" required>
                <div class="form-text">支持 .xlsx 和 .xls 格式</div>
            </div>
            <div class="d-flex gap-2 align-items-center">
                <button type="submit" class="btn btn-primary"><i class="bi bi-upload me-1"></i>开始导入</button>
                <a href="{{ url_for('admin.users') }}" class="btn btn-secondary" role="button">取消</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
