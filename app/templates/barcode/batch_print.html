{% extends "base.html" %}
{% block title %}批量打印 - 物资设备管理系统{% endblock %}
{% block content %}
<div class="card shadow-sm">
    <div class="card-header bg-white d-flex justify-content-between align-items-center">
        <h5 class="mb-0"><i class="bi bi-printer me-2"></i>批量打印</h5>
        <a href="{{ url_for('barcode.index') }}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i>返回</a>
    </div>
    <div class="card-body">
        {% if not libs_available %}
        <div class="alert alert-warning"><i class="bi bi-exclamation-triangle me-1"></i>请安装 qrcode python-barcode Pillow 库，否则二维码/条形码将无法生成图片。</div>
        {% endif %}

        <form id="batchForm" class="row g-2 mb-3" method="GET" action="{{ url_for('barcode.batch_print') }}">
            <div class="col-md-6">
                <select name="category_id" class="form-select form-select-sm" onchange="this.form.submit();">
                    <option value="0">全部分类</option>
                    {% for c in categories %}
                    <option value="{{ c.id }}" {% if c.id == category_id %}selected{% endif %}>
                        {% if c.level and c.level > 1 %}{% for i in range(c.level-1) %}　{% endfor %}{% endif %}{{ c.name }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-3">
                <input type="text" id="batchSearch" class="form-control form-control-sm" placeholder="搜索物资...">
            </div>
            <div class="col-md-3">
                <button type="button" class="btn btn-sm btn-outline-primary" id="batchSelectAll"><i class="bi bi-check2-all me-1"></i>全选</button>
                <button type="button" class="btn btn-sm btn-outline-secondary" id="batchClearAll"><i class="bi bi-eraser me-1"></i>清空</button>
            </div>
        </form>

        <!-- 批量参数 -->
        <div class="row g-2 mb-3">
            <div class="col-md-3">
                <label class="form-label small">标签尺寸</label>
                <select id="batchLabelSize" class="form-select form-select-sm">
                    <option value="40x30" selected>40×30mm</option>
                    <option value="60x40">60×40mm</option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label small">标签类型</label>
                <select id="batchLabelType" class="form-select form-select-sm">
                    <option value="qrcode" selected>二维码</option>
                    <option value="barcode" {% if not barcode_available %}disabled{% endif %}>条形码</option>
                </select>
            </div>
            <div class="col-md-2">
                <label class="form-label small">数量</label>
                <input type="number" id="batchQuantity" class="form-control form-control-sm" value="1" min="1" max="999">
            </div>
            <div class="col-md-4 d-flex align-items-end gap-2">
                <button type="button" class="btn btn-primary btn-sm" id="batchPreviewBtn"><i class="bi bi-eye me-1"></i>预览</button>
                <button type="button" class="btn btn-success btn-sm" id="batchGenerateBtn"><i class="bi bi-check2 me-1"></i>批量生成</button>
                <button type="button" class="btn btn-outline-info btn-sm" onclick="window.print();"><i class="bi bi-printer me-1"></i>打印</button>
            </div>
        </div>

        <!-- 物资列表 -->
        <div class="border rounded p-2" style="max-height:420px; overflow-y:auto;">
            {% for m in materials %}
            <div class="form-check batch-item" data-name="{{ (m.name + ' ' + (m.code or '') + ' ' + (m.specification or ''))|lower }}">
                <input class="form-check-input batch-checkbox" type="checkbox" value="{{ m.id }}" id="bmat_{{ m.id }}">
                <label class="form-check-label" for="bmat_{{ m.id }}">
                    <span class="badge bg-secondary me-1">{{ m.code or '-' }}</span>
                    {{ m.name }}
                    <small class="text-muted">{{ m.specification or '' }}</small>
                    <small class="text-muted">/ {{ m.unit }}</small>
                </label>
            </div>
            {% else %}
            <div class="text-center text-muted py-3">暂无物资数据</div>
            {% endfor %}
        </div>

        <!-- 生成结果 -->
        <div id="batchResultArea" class="mt-4" style="display:none;">
            <hr>
            <div id="batchResultMessage" class="alert alert-info py-2"></div>
            <div id="batchLabelGrid" class="label-grid"></div>
        </div>
    </div>
</div>

<script>
(function() {
    var search = document.getElementById('batchSearch');
    if (search) {
        search.addEventListener('input', function() {
            var kw = this.value.trim().toLowerCase();
            document.querySelectorAll('.batch-item').forEach(function(el) {
                var name = el.getAttribute('data-name') || '';
                el.style.display = name.indexOf(kw) >= 0 ? '' : 'none';
            });
        });
    }
    document.getElementById('batchSelectAll').addEventListener('click', function() {
        document.querySelectorAll('.batch-checkbox').forEach(function(cb) {
            if (cb.closest('.batch-item').style.display !== 'none') cb.checked = true;
        });
    });
    document.getElementById('batchClearAll').addEventListener('click', function() {
        document.querySelectorAll('.batch-checkbox').forEach(function(cb) { cb.checked = false; });
    });

    function getSelectedIds() {
        return Array.from(document.querySelectorAll('.batch-checkbox:checked')).map(function(cb) { return cb.value; });
    }

    document.getElementById('batchPreviewBtn').addEventListener('click', function() {
        var ids = getSelectedIds();
        if (ids.length === 0) { customAlert('请至少选择一个物资'); return; }
        var params = new URLSearchParams();
        ids.forEach(function(id) { params.append('material_id', id); });
        params.append('label_size', document.getElementById('batchLabelSize').value);
        params.append('label_type', document.getElementById('batchLabelType').value);
        params.append('quantity', document.getElementById('batchQuantity').value || 1);
        window.open('{{ url_for("barcode.preview") }}?' + params.toString(), '_blank');
    });

    document.getElementById('batchGenerateBtn').addEventListener('click', function() {
        var ids = getSelectedIds();
        if (ids.length === 0) { customAlert('请至少选择一个物资'); return; }
        var formData = new FormData();
        ids.forEach(function(id) { formData.append('material_ids', id); });
        formData.append('label_size', document.getElementById('batchLabelSize').value);
        formData.append('label_type', document.getElementById('batchLabelType').value);
        formData.append('quantity', document.getElementById('batchQuantity').value || 1);

        fetch('{{ url_for("barcode.generate") }}', {
            method: 'POST',
            body: formData,
            headers: { 'X-Requested-With': 'XMLHttpRequest' }
        }).then(function(r) { return r.json(); }).then(function(data) {
            var area = document.getElementById('batchResultArea');
            var msg = document.getElementById('batchResultMessage');
            var grid = document.getElementById('batchLabelGrid');
            if (data.success) {
                msg.className = 'alert alert-success py-2';
                msg.textContent = data.message || '生成成功';
                grid.innerHTML = '';
                (data.labels || []).forEach(function(label) {
                    for (var i = 0; i < (label.quantity || 1); i++) {
                        var item = document.createElement('div');
                        item.className = 'label-item label-' + (label.label_size || '40x30');
                        var html = '<img src="' + label.image_url + '" alt="标签" style="max-width:90%; max-height:60%;">';
                        html += '<div class="small fw-bold text-truncate">' + (label.material_name || '') + '</div>';
                        html += '<div class="small text-muted text-truncate">' + (label.material_code || '') + '</div>';
                        if (label.spec) html += '<div class="small text-muted text-truncate">' + label.spec + '</div>';
                        html += '<div class="small text-muted">单位：' + (label.unit || '') + '</div>';
                        item.innerHTML = html;
                        grid.appendChild(item);
                    }
                });
                area.style.display = '';
            } else {
                msg.className = 'alert alert-danger py-2';
                msg.textContent = data.message || '生成失败';
                area.style.display = '';
            }
        }).catch(function(err) { customAlert('请求失败：' + err); });
    });
})();
</script>
{% endblock %}
