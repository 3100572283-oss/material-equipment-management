{% extends "base.html" %}
{% block title %}钢材理论重量换算 - 物资设备管理系统{% endblock %}
{% block content %}
<div class="row g-3">
    <div class="col-lg-7">
        <div class="card shadow-sm">
            <div class="card-header bg-white d-flex justify-content-between align-items-center">
                <h5 class="mb-0"><i class="bi bi-rulers me-2"></i>钢材理论重量换算</h5>
                <a href="{{ url_for('steel.specs') }}" class="btn btn-outline-secondary btn-sm">
                    <i class="bi bi-card-list me-1"></i>规格表管理
                </a>
            </div>
            <div class="card-body">
                <form id="calcForm">
                    <div class="row mb-3">
                        <label class="col-sm-3 col-form-label text-end">规格类型 <span class="text-danger">*</span></label>
                        <div class="col-sm-9">
                            <select class="form-select" id="spec_type" name="spec_type" required>
                                <option value="">请选择规格类型</option>
                                <option value="rebar">钢筋</option>
                                <option value="plate">钢板</option>
                                <option value="angle">角钢</option>
                                <option value="pipe">钢管</option>
                            </select>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <label class="col-sm-3 col-form-label text-end">规格名称 <span class="text-danger">*</span></label>
                        <div class="col-sm-9">
                            <select class="form-select" id="spec_name" name="spec_name" required disabled>
                                <option value="">请先选择规格类型</option>
                            </select>
                            <small class="text-muted" id="specInfo"></small>
                        </div>
                    </div>
                    <div class="row mb-3" id="lengthRow">
                        <label class="col-sm-3 col-form-label text-end">长度(m) <span class="text-danger">*</span></label>
                        <div class="col-sm-9">
                            <input type="number" class="form-control" id="length" name="length" step="0.001" min="0" placeholder="请输入长度" value="6">
                        </div>
                    </div>
                    <div class="row mb-3" id="countRow">
                        <label class="col-sm-3 col-form-label text-end">根数 <span class="text-danger">*</span></label>
                        <div class="col-sm-9">
                            <input type="number" class="form-control" id="count" name="count" step="1" min="1" placeholder="请输入根数" value="1">
                        </div>
                    </div>
                    <div class="row mb-3 d-none" id="widthRow">
                        <label class="col-sm-3 col-form-label text-end">宽度(m) <span class="text-danger">*</span></label>
                        <div class="col-sm-9">
                            <input type="number" class="form-control" id="width" name="width" step="0.001" min="0" placeholder="请输入宽度" value="1.5">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-sm-9 offset-sm-3">
                            <button type="submit" class="btn btn-primary" id="calcBtn">
                                <i class="bi bi-calculator me-1"></i>开始换算
                            </button>
                            <button type="reset" class="btn btn-outline-secondary ms-2" id="resetBtn">
                                <i class="bi bi-arrow-counterclockwise me-1"></i>重置
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <div class="col-lg-5">
        <div class="card shadow-sm" id="resultCard">
            <div class="card-header bg-white">
                <h5 class="mb-0"><i class="bi bi-bar-chart-line me-2"></i>换算结果</h5>
            </div>
            <div class="card-body" id="resultBody">
                <div class="text-center text-muted py-5">
                    <i class="bi bi-calculator" style="font-size:3rem;"></i>
                    <div class="mt-2">填写参数后点击"开始换算"查看结果</div>
                </div>
            </div>
        </div>

        <div class="card shadow-sm mt-3">
            <div class="card-header bg-white">
                <h6 class="mb-0"><i class="bi bi-info-circle me-2"></i>换算公式</h6>
            </div>
            <div class="card-body">
                <ul class="small text-muted mb-0 ps-3">
                    <li class="mb-1"><strong>钢筋/钢管/角钢：</strong>理论重量(kg/m) × 长度(m) × 根数 = 总重量(kg)</li>
                    <li class="mb-1"><strong>钢板：</strong>理论重量(kg/㎡) × 长度(m) × 宽度(m) = 总重量(kg)</li>
                    <li class="mb-1">1吨 = 1000公斤(kg)</li>
                </ul>
            </div>
        </div>
    </div>
</div>

<script>
// 将规格数据按类型分组
var ALL_SPECS = {{ specs | tojson }};
var SPEC_TYPE_LABEL = {
    'rebar': '钢筋',
    'plate': '钢板',
    'angle': '角钢',
    'pipe': '钢管'
};

// 按规格类型筛选规格名称
function filterSpecs(specType) {
    return ALL_SPECS.filter(function(s) { return s.spec_type === specType; });
}

// 规格类型切换
document.getElementById('spec_type').addEventListener('change', function() {
    var specType = this.value;
    var specNameSelect = document.getElementById('spec_name');
    var specInfo = document.getElementById('specInfo');
    var widthRow = document.getElementById('widthRow');
    var countRow = document.getElementById('countRow');

    specNameSelect.innerHTML = '<option value="">请选择规格</option>';
    specInfo.textContent = '';

    if (!specType) {
        specNameSelect.disabled = true;
        return;
    }

    specNameSelect.disabled = false;
    var list = filterSpecs(specType);
    list.forEach(function(s) {
        var opt = document.createElement('option');
        opt.value = s.spec_name;
        opt.textContent = s.spec_name + ' (' + s.theoretical_weight + ' ' + s.unit + ')';
        opt.dataset.weight = s.theoretical_weight;
        opt.dataset.unit = s.unit;
        specNameSelect.appendChild(opt);
    });

    // 钢板显示宽度，隐藏根数；其他类型显示根数，隐藏宽度
    if (specType === 'plate') {
        widthRow.classList.remove('d-none');
        countRow.classList.add('d-none');
    } else {
        widthRow.classList.add('d-none');
        countRow.classList.remove('d-none');
    }
});

// 规格名称选择时显示规格信息
document.getElementById('spec_name').addEventListener('change', function() {
    var opt = this.options[this.selectedIndex];
    var specInfo = document.getElementById('specInfo');
    if (opt && opt.dataset.weight) {
        specInfo.textContent = '理论重量：' + opt.dataset.weight + ' ' + opt.dataset.unit;
    } else {
        specInfo.textContent = '';
    }
});

// 表单提交
document.getElementById('calcForm').addEventListener('submit', function(e) {
    e.preventDefault();
    var btn = document.getElementById('calcBtn');
    var btnHtml = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>计算中...';

    var formData = new FormData(this);

    fetch('{{ url_for("steel.api_calculate") }}', {
        method: 'POST',
        body: formData
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
        var body = document.getElementById('resultBody');
        if (!data.success) {
            body.innerHTML = '<div class="alert alert-danger mb-0"><i class="bi bi-exclamation-triangle me-1"></i>' + (data.message || '计算失败') + '</div>';
            return;
        }
        var detail = data.detail || {};
        var formulaHtml = detail.formula ? '<div class="text-muted small mt-2"><i class="bi bi-calculator me-1"></i>' + detail.formula + '</div>' : '';
        var countHtml = detail.count !== undefined ? '<div class="mb-1"><span class="text-muted">根数：</span>' + detail.count + ' 根</div>' : '';
        var widthHtml = detail.width !== undefined ? '<div class="mb-1"><span class="text-muted">宽度：</span>' + detail.width + ' m</div>' : '';

        body.innerHTML =
            '<div class="text-center mb-3">' +
                '<div class="text-muted small">总重量</div>' +
                '<div class="display-5 text-primary fw-bold">' + window.fmtNumber(data.weight, 2) + '</div>' +
                '<div class="text-muted small">公斤 (kg)</div>' +
            '</div>' +
            '<div class="text-center mb-3 pb-3 border-bottom">' +
                '<div class="text-muted small">约 <span class="badge bg-success fs-6">' + window.fmtNumber(data.weight_t, 4) + '</span> 吨 (t)</div>' +
            '</div>' +
            '<div class="bg-light p-3 rounded">' +
                '<div class="fw-bold mb-2"><i class="bi bi-list-ul me-1"></i>计算明细</div>' +
                '<div class="mb-1"><span class="text-muted">类型：</span>' + (detail.spec_type || '-') + '</div>' +
                '<div class="mb-1"><span class="text-muted">规格：</span>' + (detail.spec_name || '-') + '</div>' +
                '<div class="mb-1"><span class="text-muted">理论重量：</span>' + window.fmtNumber(detail.theoretical_weight, 4) + ' ' + (detail.unit || '') + '</div>' +
                '<div class="mb-1"><span class="text-muted">长度：</span>' + (detail.length !== undefined ? detail.length + ' m' : '-') + '</div>' +
                countHtml + widthHtml +
            '</div>' +
            formulaHtml;
    })
    .catch(function(err) {
        document.getElementById('resultBody').innerHTML = '<div class="alert alert-danger mb-0"><i class="bi bi-exclamation-triangle me-1"></i>请求失败：' + err.message + '</div>';
    })
    .finally(function() {
        btn.disabled = false;
        btn.innerHTML = btnHtml;
    });
});

// 重置按钮
document.getElementById('resetBtn').addEventListener('click', function() {
    setTimeout(function() {
        var specNameSelect = document.getElementById('spec_name');
        specNameSelect.innerHTML = '<option value="">请先选择规格类型</option>';
        specNameSelect.disabled = true;
        document.getElementById('specInfo').textContent = '';
        document.getElementById('widthRow').classList.add('d-none');
        document.getElementById('countRow').classList.remove('d-none');
        document.getElementById('resultBody').innerHTML = '<div class="text-center text-muted py-5"><i class="bi bi-calculator" style="font-size:3rem;"></i><div class="mt-2">填写参数后点击"开始换算"查看结果</div></div>';
    }, 0);
});
</script>
{% endblock %}
