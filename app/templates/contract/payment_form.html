{% extends "base.html" %}
{% block title %}{{ '编辑' if payment else '新增' }}付款 - 物资设备管理系统{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-sm">
            <div class="card-header bg-white"><h5 class="mb-0">{{ '编辑' if payment else '新增' }}付款记录</h5></div>
            <div class="card-body">
                <form method="POST">
                    <div class="row g-3">
                        <div class="col-md-12">
                            <label class="form-label">关联合同 <span class="text-danger">*</span></label>
                            <select class="form-select" name="contract_id" required>
                                <option value="">-- 请选择 --</option>
                                {% for c in contracts %}
                                <option value="{{ c.id }}" {% if (payment and payment.contract_id == c.id) or (pre_contract_id == c.id) %}selected{% endif %}>{{ c.code }} - {{ c.name }} ({{ c.supplier.name if c.supplier else '-' }})</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">付款日期</label>
                            <input type="date" class="form-control" name="payment_date" value="{{ payment.payment_date if payment else '' }}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">付款金额 <span class="text-danger">*</span></label>
                            <input type="number" step="0.01" min="0" class="form-control text-end" name="amount" value="{{ payment.amount if payment else '0' }}" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">付款方式</label>
                            <select class="form-select" name="method">
                                {% for label, value in get_dict_items('payment_method') %}
                                <option value="{{ value }}" {% if (payment and payment.method == value) or (not payment and value == '银行转账') %}selected{% endif %}>{{ label }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-12">
                            <label class="form-label">备注</label>
                            <textarea class="form-control" name="remark" rows="2">{{ payment.remark if payment else '' }}</textarea>
                        </div>
                    </div>
                    <div class="mt-4">
                        <button type="submit" class="btn btn-primary">保存</button>
                        <a href="{{ url_for('contract.payments') }}" class="btn btn-secondary ms-2">返回</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
