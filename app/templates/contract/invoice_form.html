{% extends "base.html" %}
{% block title %}{{ '编辑' if invoice else '新增' }}发票 - 物资设备管理系统{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-sm">
            <div class="card-header bg-white d-flex justify-content-between align-items-center">
                <h5 class="mb-0">{{ '编辑' if invoice else '新增' }}发票</h5>
                <span class="badge bg-info">预留AI发票识别接口</span>
            </div>
            <div class="card-body">
                <form method="POST" enctype="multipart/form-data">
                    <div class="row g-3">
                        <div class="col-md-12">
                            <label class="form-label">关联合同 <span class="text-danger">*</span></label>
                            <select class="form-select" name="contract_id" id="contractSelect" required>
                                <option value="">-- 请选择 --</option>
                                {% for c in contracts %}
                                <option value="{{ c.id }}" {% if (invoice and invoice.contract_id == c.id) or (pre_contract_id == c.id) %}selected{% endif %}>{{ c.code }} - {{ c.name }} ({{ c.supplier.name if c.supplier else '-' }})</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">发票代码</label>
                            <input type="text" class="form-control" name="invoice_code" value="{{ invoice.invoice_code if invoice else '' }}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">发票号码</label>
                            <input type="text" class="form-control" name="invoice_number" value="{{ invoice.invoice_number if invoice else '' }}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">开票日期</label>
                            <input type="date" class="form-control" name="invoice_date" value="{{ invoice.invoice_date if invoice else '' }}">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">含税金额 <span class="text-danger">*</span></label>
                            <input type="number" step="0.01" min="0" class="form-control text-end" name="amount_with_tax" id="amount_with_tax" value="{{ invoice.amount_with_tax if invoice else '0' }}" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">税率(%)</label>
                            <select class="form-select" name="tax_rate" id="tax_rate">
                                {% for label, value in get_dict_items('tax_rate') %}
                                <option value="{{ value }}" {% if (invoice and invoice.tax_rate|string == value|string) or (not invoice and value == '13') %}selected{% endif %}>{{ label }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">不含税金额（自动）</label>
                            <input type="text" class="form-control text-end fw-bold" id="amount_without_tax" readonly value="{{ '%.2f'|format(invoice.amount_without_tax or 0) if invoice else '0.00' }}">
                        </div>
                        <div class="col-md-12">
                            <label class="form-label">发票文件</label>
                            <input type="file" class="form-control" name="file" accept="image/*,.pdf">
                            {% if invoice and invoice.file_path %}
                            <div class="mt-2"><a href="{{ url_for('static', filename=invoice.file_path) }}" target="_blank" class="btn btn-sm btn-outline-info">查看当前文件</a></div>
                            {% endif %}
                        </div>
                        <div class="col-md-12">
                            <label class="form-label">备注</label>
                            <textarea class="form-control" name="remark" rows="2">{{ invoice.remark if invoice else '' }}</textarea>
                        </div>
                    </div>
                    <div class="mt-4">
                        <button type="submit" class="btn btn-primary">保存</button>
                        <a href="{{ url_for('contract.invoices') }}" class="btn btn-secondary ms-2">返回</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
function calc() {
    const awt = parseFloat(document.getElementById('amount_with_tax').value) || 0;
    const rate = parseFloat(document.getElementById('tax_rate').value) || 0;
    document.getElementById('amount_without_tax').value = (rate > 0 ? (awt / (1 + rate / 100)) : awt).toFixed(2);
}
document.getElementById('amount_with_tax').addEventListener('input', calc);
document.getElementById('tax_rate').addEventListener('change', calc);
</script>
{% endblock %}
