<!-- 节点表单模态框（新增/编辑共用） -->
<div class="modal fade" id="nodeModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="nodeForm" method="POST">
                <div class="modal-header">
                    <h5 class="modal-title" id="nodeModalTitle">新增节点</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="nodeIdInput" name="node_id" value="">
                    <div class="mb-3">
                        <label class="form-label">节点名称 <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" name="node_name" required
                               placeholder="例如：部门经理审批">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">审批方式 <span class="text-danger">*</span></label>
                        <div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="approve_type"
                                       id="approveTypeRole" value="role" checked>
                                <label class="form-check-label" for="approveTypeRole">按角色</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="approve_type"
                                       id="approveTypeUser" value="user">
                                <label class="form-check-label" for="approveTypeUser">指定人员</label>
                            </div>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">通过规则</label>
                        <div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="pass_rule"
                                       id="passRuleAny" value="ANY" checked>
                                <label class="form-check-label" for="passRuleAny">或签（任意一人同意即通过）</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="pass_rule"
                                       id="passRuleAll" value="ALL">
                                <label class="form-check-label" for="passRuleAll">会签（所有人同意才通过）</label>
                            </div>
                        </div>
                    </div>
                    <!-- 按角色：多选复选框 -->
                    <div class="mb-3" id="roleSection">
                        <label class="form-label">审批角色 <span class="text-danger">*</span></label>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="approve_role" value="admin" id="roleAdmin">
                            <label class="form-check-label" for="roleAdmin">管理员</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="approve_role" value="editor" id="roleEditor">
                            <label class="form-check-label" for="roleEditor">录入员</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="approve_role" value="viewer" id="roleViewer">
                            <label class="form-check-label" for="roleViewer">查看员</label>
                        </div>
                        <div class="form-text">勾选的角色均可审批此节点</div>
                    </div>
                    <!-- 指定人员：下拉选择 -->
                    <div class="mb-3" id="userSection" style="display:none;">
                        <label class="form-label">指定审批人 <span class="text-danger">*</span></label>
                        <select class="form-select" name="approve_user_id">
                            <option value="">请选择用户</option>
                            {% for u in users %}
                            <option value="{{ u.id }}">{{ u.name or u.username }}（{{ u.username }}）</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-lg me-1"></i>保存
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
