{% extends "mobile/base.html" %}
{% block title %}扫码巡检{% endblock %}
{% block nav_title %}扫码巡检{% endblock %}

{% block content %}
<div class="m-card" style="text-align:center; padding:32px 16px;">
    <div style="width:80px; height:80px; border-radius:50%; background:linear-gradient(135deg,#2b8a3e,#1a6f2e); color:#fff; display:flex; align-items:center; justify-content:center; margin:0 auto 16px; font-size:36px;">
        <i class="bi bi-qr-code-scan"></i>
    </div>
    <div style="font-size:18px; font-weight:600; color:#212529;">扫码巡检</div>
    <div style="font-size:13px; color:#6c757d; margin-top:6px;">
        扫描设备二维码后自动定位待巡检任务
    </div>
    <button type="button" class="m-btn m-btn-primary m-btn-block"
            style="margin-top:24px; background:#2b8a3e; border-color:#2b8a3e;"
            onclick="startScan()">
        <i class="bi bi-qr-code-scan"></i> 开始扫码
    </button>
</div>

<div class="m-card">
    <div class="m-card-title"><i class="bi bi-info-circle"></i>使用说明</div>
    <div style="font-size:13px; color:#495057; line-height:1.8;">
        1. 点击"开始扫码"打开摄像头<br>
        2. 对准设备上的二维码标签<br>
        3. 系统自动识别并跳转到巡检录入页<br>
        4. 完成巡检项填写后提交
    </div>
</div>

<div class="m-card">
    <div class="m-card-title"><i class="bi bi-list-ul"></i>待巡检任务</div>
    <a href="{{ url_for('mobile.inspection_list') }}" class="m-btn m-btn-outline-primary m-btn-block">
        <i class="bi bi-arrow-right"></i> 查看我的巡检任务
    </a>
</div>
{% endblock %}

{% block extra_js %}
<script>
function startScan(){
    MobileScanner.open(function(code){
        // 扫码后跳转到扫码巡检入口，由后端识别设备并定位待巡检任务
        window.location.href = "{{ url_for('mobile.inspection_scan') }}?code=" + encodeURIComponent(code);
    });
}
</script>
{% endblock %}
