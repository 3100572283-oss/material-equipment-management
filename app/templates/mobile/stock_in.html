{% extends "mobile/base_mobile.html" %}
{% block title %}离线入库录入{% endblock %}
{% block nav_title %}离线入库录入{% endblock %}
{% block back_url %}{{ url_for('mobile.index') }}{% endblock %}

{% block content %}
<!-- 已保存条数提示 -->
<div class="mobile-card d-flex justify-content-between align-items-center">
    <div>
        <i class="bi bi-save text-primary me-1"></i>
        <span class="small">已保存到本地：</span>
        <span class="fw-bold text-primary" id="saved-count">0</span>
        <span class="small">条</span>
    </div>
    <a href="{{ url_for('mobile.offline_data') }}" class="btn btn-sm btn-outline-primary">
        查看已保存 <i class="bi bi-chevron-right"></i>
    </a>
</div>

<!-- 入库表单 -->
<form id="stock-in-form" class="mobile-card">
    <input type="hidden" id="saved_at" name="saved_at">

    <!-- 物资选择（搜索下拉） -->
    <div class="mb-3">
        <label class="form-label"><i class="bi bi-box me-1"></i>选择物资</label>
        <select class="form-select" id="material_id" name="material_id" required>
            <option value="">正在加载物资...</option>
        </select>
        <div id="material-info" class="small text-muted mt-1" style="min-height:20px;"></div>
    </div>

    <!-- 搜索过滤 -->
    <div class="mb-3">
        <input type="text" class="form-control" id="material-search"
               placeholder="输入名称/编码搜索物资..." autocomplete="off">
    </div>

    <!-- 数量 -->
    <div class="mb-3">
        <label class="form-label"><i class="bi bi-123 me-1"></i>数量</label>
        <input type="number" class="form-control" id="quantity" name="quantity"
               step="0.0001" min="0" placeholder="请输入数量" required inputmode="decimal">
    </div>

    <!-- 单价 -->
    <div class="mb-3">
        <label class="form-label"><i class="bi bi-currency-yen me-1"></i>单价</label>
        <input type="number" class="form-control" id="unit_price" name="unit_price"
               step="0.0001" min="0" placeholder="请输入单价（选填）" inputmode="decimal">
    </div>

    <!-- 批次号 -->
    <div class="mb-3">
        <label class="form-label"><i class="bi bi-upc-scan me-1"></i>批次号</label>
        <input type="text" class="form-control" id="batch_no" name="batch_no"
               placeholder="请输入批次号（选填）">
    </div>

    <!-- 备注 -->
    <div class="mb-3">
        <label class="form-label"><i class="bi bi-chat-dots me-1"></i>备注</label>
        <textarea class="form-control" id="remark" name="remark" rows="2"
                  placeholder="备注信息（选填）"></textarea>
    </div>

    <!-- 金额预览 -->
    <div class="mb-3 text-end">
        <span class="text-muted small">金额合计：</span>
        <span class="fw-bold text-primary" id="amount-preview">0.00</span>
    </div>

    <!-- 操作按钮 -->
    <button type="submit" class="btn btn-primary btn-lg-mobile w-100 mb-2">
        <i class="bi bi-save me-1"></i>保存到本地
    </button>
    <a href="{{ url_for('mobile.offline_data') }}" class="btn btn-outline-secondary btn-lg-mobile w-100">
        <i class="bi bi-list-check me-1"></i>查看已保存
    </a>
</form>

<!-- 保存结果提示 -->
<div id="save-result" class="alert alert-success alert-mobile mt-3" style="display:none;">
    <i class="bi bi-check-circle me-1"></i><span id="save-msg"></span>
</div>
{% endblock %}

{% block extra_js %}
<script>
(function() {
    var materials = [];

    // 加载物资列表（优先使用缓存，再从服务器拉取最新）
    function loadMaterials() {
        // 先用缓存数据快速渲染
        var cached = MobileOffline.getCachedData('materials');
        if (cached && cached.length) {
            materials = cached;
            renderMaterials('');
        }

        // 从服务器拉取最新数据（在线时）
        if (navigator.onLine) {
            fetch('{{ url_for("mobile.api_material_list") }}')
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    materials = data || [];
                    MobileOffline.cacheData('materials', materials);
                    renderMaterials(document.getElementById('material-search').value);
                })
                .catch(function() {
                    if (!cached) {
                        var sel = document.getElementById('material_id');
                        sel.innerHTML = '<option value="">加载物资失败，请检查网络</option>';
                    }
                });
        } else if (!cached) {
            var sel = document.getElementById('material_id');
            sel.innerHTML = '<option value="">无缓存数据，请联网后加载</option>';
        }
    }

    // 渲染物资下拉
    function renderMaterials(keyword) {
        var sel = document.getElementById('material_id');
        keyword = (keyword || '').trim().toLowerCase();
        var filtered = materials;
        if (keyword) {
            filtered = materials.filter(function(m) {
                return (m.name || '').toLowerCase().indexOf(keyword) >= 0 ||
                       (m.code || '').toLowerCase().indexOf(keyword) >= 0;
            });
        }
        var html = '<option value="">请选择物资</option>';
        filtered.forEach(function(m) {
            var label = m.name;
            if (m.code) label += ' [' + m.code + ']';
            if (m.spec) label += ' ' + m.spec;
            if (m.unit) label += ' /' + m.unit;
            html += '<option value="' + m.id + '" data-unit="' + (m.unit || '') + '">' +
                    label + '</option>';
        });
        if (!filtered.length) {
            html = '<option value="">无匹配物资</option>';
        }
        sel.innerHTML = html;
    }

    // 物资选择变化时显示信息
    document.getElementById('material_id').addEventListener('change', function() {
        var opt = this.options[this.selectedIndex];
        var unit = opt ? opt.getAttribute('data-unit') : '';
        var info = document.getElementById('material-info');
        info.textContent = unit ? '单位：' + unit : '';
    });

    // 搜索过滤
    document.getElementById('material-search').addEventListener('input', function() {
        renderMaterials(this.value);
    });

    // 金额预览
    function updateAmount() {
        var qty = parseFloat(document.getElementById('quantity').value) || 0;
        var price = parseFloat(document.getElementById('unit_price').value) || 0;
        document.getElementById('amount-preview').textContent = (qty * price).toFixed(2);
    }
    document.getElementById('quantity').addEventListener('input', updateAmount);
    document.getElementById('unit_price').addEventListener('input', updateAmount);

    // 表单提交：保存到 localStorage
    document.getElementById('stock-in-form').addEventListener('submit', function(e) {
        e.preventDefault();
        var materialId = parseInt(document.getElementById('material_id').value);
        var quantity = parseFloat(document.getElementById('quantity').value);
        var unitPrice = parseFloat(document.getElementById('unit_price').value) || 0;
        var batchNo = document.getElementById('batch_no').value.trim();
        var remark = document.getElementById('remark').value.trim();

        if (!materialId) {
            alert('请选择物资');
            return;
        }
        if (!quantity || quantity <= 0) {
            alert('请输入有效数量');
            return;
        }

        var rec = MobileOffline.addRecord({
            type: 'stock_in',
            data: {
                material_id: materialId,
                material_name: getMaterialName(materialId),
                quantity: quantity,
                unit_price: unitPrice,
                batch_no: batchNo,
                remark: remark
            }
        });

        // 显示成功提示
        var result = document.getElementById('save-result');
        var msg = document.getElementById('save-msg');
        msg.textContent = '已保存到本地（共 ' + MobileOffline.count() + ' 条待同步）';
        result.style.display = 'block';
        setTimeout(function() { result.style.display = 'none'; }, 2500);

        // 清空表单（保留物资选择以便连续录入）
        document.getElementById('quantity').value = '';
        document.getElementById('unit_price').value = '';
        document.getElementById('batch_no').value = '';
        document.getElementById('remark').value = '';
        document.getElementById('amount-preview').textContent = '0.00';
        document.getElementById('quantity').focus();

        updateSavedCount();
    });

    function getMaterialName(id) {
        for (var i = 0; i < materials.length; i++) {
            if (materials[i].id === id) return materials[i].name;
        }
        return '';
    }

    function updateSavedCount() {
        document.getElementById('saved-count').textContent = MobileOffline.count();
    }

    loadMaterials();
    updateSavedCount();
})();
</script>
{% endblock %}
