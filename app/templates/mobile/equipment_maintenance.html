{% extends "mobile/base.html" %}
{% block title %}维修保养登记{% endblock %}
{% block nav_title %}维保登记{% endblock %}

{% block content %}
<form method="POST" id="maintForm" enctype="multipart/form-data">
    <!-- 设备信息 -->
    <div class="m-card">
        <div class="m-card-title"><i class="bi bi-truck"></i>设备信息</div>
        <div class="m-info-row"><span>设备名称</span><span>{{ eq.name }}</span></div>
        <div class="m-info-row"><span>设备编号</span><span>{{ eq.code }}</span></div>
        <div class="m-info-row"><span>规格型号</span><span>{{ eq.specification or '-' }}</span></div>
    </div>

    <!-- 维保信息 -->
    <div class="m-card">
        <div class="m-card-title"><i class="bi bi-tools"></i>维保信息</div>
        <div class="m-form-group">
            <label class="m-form-label">维修类型<span class="req">*</span></label>
            <select name="maintain_type" class="m-form-select">
                {% for label, value in maintain_types %}
                <option value="{{ value }}" {% if label == '故障维修' %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="m-form-group">
            <label class="m-form-label">维修日期<span class="req">*</span></label>
            <input type="date" name="maintain_date" class="m-form-control" value="{{ today }}" required>
        </div>
        <div class="m-form-group">
            <label class="m-form-label">故障/维保描述<span class="req">*</span></label>
            <textarea name="content" class="m-form-control" rows="3" placeholder="详细描述故障现象或维保内容..." required></textarea>
        </div>
        <div class="m-form-group">
            <label class="m-form-label">维修人员</label>
            <input type="text" name="operator" class="m-form-control" value="{{ current_user.name or current_user.username }}">
        </div>
        <div class="m-form-group">
            <label class="m-form-label">维修单位</label>
            <input type="text" name="vendor" class="m-form-control" placeholder="维修厂家/班组">
        </div>
        <div class="m-form-group">
            <label class="m-form-label">维修费用（元）</label>
            <input type="number" name="cost" class="m-form-control" step="0.01" min="0" value="0">
        </div>
        <div class="m-form-group">
            <label class="m-form-label">下次维保日期</label>
            <input type="date" name="next_maintain_date" class="m-form-control">
        </div>
        <div class="m-form-group">
            <label class="m-form-label">备注</label>
            <textarea name="remark" class="m-form-control" rows="2" placeholder="备注..."></textarea>
        </div>
    </div>

    <!-- 维修照片 -->
    <div class="m-card">
        <div class="m-card-title"><i class="bi bi-camera"></i>维修前/后照片（最多6张）</div>
        <div class="m-photo-grid" id="photoGrid">
            <label class="m-photo-add" style="position:relative;">
                <input type="file" accept="image/*" capture="environment" multiple
                       style="position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;cursor:pointer;"
                       onchange="handlePhotoSelect(this)">
            </label>
        </div>
        <div style="font-size:12px;color:#adb5bd;margin-top:8px;">建议先拍维修前照片，再拍维修后照片</div>
    </div>
</form>

<div class="m-submit-bar">
    <button type="button" class="m-btn m-btn-primary" style="flex:1;" onclick="submitForm()">
        <i class="bi bi-check-lg" style="margin-right:6px;"></i>提交维保记录
    </button>
</div>
{% endblock %}

{% block extra_js %}
<script>
var photos = [];

function handlePhotoSelect(input){
    var files = input.files;
    if (!files || files.length === 0) return;
    var remaining = 6 - photos.length;
    if (files.length > remaining) M.toast('最多6张', 'warning');
    for (var i = 0; i < Math.min(files.length, remaining); i++) {
        compressImage(files[i]);
    }
    input.value = '';
}

function compressImage(file){
    var reader = new FileReader();
    reader.onload = function(e){
        var img = new Image();
        img.onload = function(){
            var max = 1280, w = img.width, h = img.height;
            if (w > max || h > max) {
                if (w > h) { h = h * max / w; w = max; }
                else { w = w * max / h; h = max; }
            }
            var canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            photos.push({ dataUrl: canvas.toDataURL('image/jpeg', 0.7), name: file.name });
            renderPhotos();
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(file);
}

function renderPhotos(){
    var grid = document.getElementById('photoGrid');
    while (grid.children.length > 1) grid.removeChild(grid.lastChild);
    photos.forEach(function(p, i){
        var div = document.createElement('div');
        div.className = 'm-photo-item';
        div.style.cssText = 'position:relative;width:72px;height:72px;border-radius:6px;overflow:hidden;';
        div.innerHTML = '<img src="' + p.dataUrl + '" style="width:100%;height:100%;object-fit:cover;" onclick="previewPhoto(' + i + ')">' +
            '<div style="position:absolute;top:2px;right:2px;width:18px;height:18px;background:rgba(0,0,0,0.6);color:#fff;border-radius:50%;text-align:center;line-height:18px;font-size:12px;cursor:pointer;" onclick="event.stopPropagation();removePhoto(' + i + ')">×</div>';
        grid.appendChild(div);
    });
}

function removePhoto(i){ photos.splice(i, 1); renderPhotos(); }
function previewPhoto(i){
    var urls = photos.map(function(p){ return p.dataUrl; });
    if (window.MobilePreview) MobilePreview.open(urls, i);
}

function submitForm(){
    var form = document.getElementById('maintForm');
    if (!form.content.value.trim()) {
        M.toast('请填写维保描述', 'danger'); return;
    }
    var fd = new FormData(form);
    photos.forEach(function(p){
        var arr = p.dataUrl.split(',');
        var mime = arr[0].match(/:(.*?);/)[1] || 'image/jpeg';
        var byteStr = atob(arr[1]);
        var ab = new ArrayBuffer(byteStr.length);
        var u8 = new Uint8Array(ab);
        for (var j = 0; j < byteStr.length; j++) u8[j] = byteStr.charCodeAt(j);
        fd.append('photos[]', new Blob([ab], { type: mime }), p.name);
    });
    M.loading(true);
    fetch(window.location.href, {
        method: 'POST', body: fd, credentials: 'same-origin'
    }).then(function(r){
        M.loading(false);
        if (r.redirected) window.location.href = r.url;
        else window.location.reload();
    }).catch(function(err){
        M.loading(false);
        M.toast('提交失败：' + err, 'danger');
    });
}
</script>
{% endblock %}

<style>
.m-info-row { display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid #f1f3f5; font-size:14px; }
.m-info-row:last-child { border-bottom:none; }
.m-info-row span:first-child { color:#6c757d; }
.m-info-row span:last-child { color:#212529; font-weight:500; text-align:right; max-width:60%; word-break:break-all; }
</style>
