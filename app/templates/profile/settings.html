{% extends "base.html" %}
{% block title %}个人设置 - 物资设备管理系统{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-white">
                <h5 class="mb-0"><i class="bi bi-person-gear me-2"></i>个人设置</h5>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('profile.settings') }}">
                    <h6 class="text-primary mb-3"><i class="bi bi-person me-1"></i>基本信息</h6>
                    <div class="row mb-3">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">用户名</label>
                            <input type="text" class="form-control" value="{{ user.username }}" readonly disabled>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">姓名</label>
                            <input type="text" class="form-control" name="name" value="{{ user.name or '' }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">邮箱</label>
                            <input type="email" class="form-control" name="email" value="{{ user.email or '' }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">手机号</label>
                            <input type="text" class="form-control" name="phone" value="{{ user.phone or '' }}">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">部门</label>
                            <input type="text" class="form-control" name="department" value="{{ user.department or '' }}">
                        </div>
                    </div>

                    <hr>
                    <h6 class="text-primary mb-3"><i class="bi bi-sliders me-1"></i>偏好设置</h6>
                    <div class="row mb-3">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">每页显示条数</label>
                            <select class="form-select" name="per_page">
                                <option value="10" {% if user.per_page == 10 %}selected{% endif %}>10 条</option>
                                <option value="20" {% if user.per_page == 20 %}selected{% endif %}>20 条</option>
                                <option value="50" {% if user.per_page == 50 %}selected{% endif %}>50 条</option>
                                <option value="100" {% if user.per_page == 100 %}selected{% endif %}>100 条</option>
                            </select>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">通知渠道偏好</label>
                        <div class="d-flex flex-wrap gap-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="notify_channels" value="email" id="ch_email" {% if '"email"' in (user.notify_channels or '[]') %}checked{% endif %}>
                                <label class="form-check-label" for="ch_email"><i class="bi bi-envelope me-1"></i>邮件</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="notify_channels" value="dingtalk" id="ch_dingtalk" {% if '"dingtalk"' in (user.notify_channels or '[]') %}checked{% endif %}>
                                <label class="form-check-label" for="ch_dingtalk"><i class="bi bi-chat-dots me-1"></i>钉钉</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="notify_channels" value="wechat" id="ch_wechat" {% if '"wechat"' in (user.notify_channels or '[]') %}checked{% endif %}>
                                <label class="form-check-label" for="ch_wechat"><i class="bi bi-wechat me-1"></i>企业微信</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="notify_channels" value="feishu" id="ch_feishu" {% if '"feishu"' in (user.notify_channels or '[]') %}checked{% endif %}>
                                <label class="form-check-label" for="ch_feishu"><i class="bi bi-broadcast me-1"></i>飞书</label>
                            </div>
                        </div>
                        <small class="text-muted">选择希望接收系统通知的渠道</small>
                    </div>
                    <div>
                        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>保存设置</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-header bg-white">
                <h5 class="mb-0"><i class="bi bi-key me-2"></i>修改密码</h5>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('profile.change_password') }}">
                    <div class="mb-3">
                        <label class="form-label">原密码 <span class="text-danger">*</span></label>
                        <input type="password" class="form-control" name="old_password" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">新密码 <span class="text-danger">*</span></label>
                        <input type="password" class="form-control" name="new_password" required>
                        <small class="text-muted">密码长度不少于6位</small>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">确认新密码 <span class="text-danger">*</span></label>
                        <input type="password" class="form-control" name="confirm_password" required>
                    </div>
                    <div>
                        <button type="submit" class="btn btn-warning"><i class="bi bi-shield-lock me-1"></i>修改密码</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
