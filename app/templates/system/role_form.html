{% extends "base.html" %}
{% block title %}{{ '编辑角色' if role else '新增角色' }} - 物资设备管理系统{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item"><a href="{{ url_for('system.roles') }}">角色管理</a></li>
            <li class="breadcrumb-item active">{{ '编辑角色' if role else '新增角色' }}</li>
        </ol>
    </nav>
    <a href="{{ url_for('system.roles') }}" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left me-1"></i>返回
    </a>
</div>

<div class="card shadow-sm">
    <div class="card-header bg-white">
        <h6 class="mb-0"><i class="bi bi-shield me-2"></i>{{ '编辑角色' if role else '新增角色' }}</h6>
    </div>
    <div class="card-body">
        <form method="POST" action="">
            <div class="row mb-3">
                <label class="col-sm-2 col-form-label">角色编码 <span class="text-danger">*</span></label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" name="role_code" required
                           {% if role and role.role_code == 'super_admin' %}readonly{% endif %}
                           value="{{ role.role_code if role else '' }}" placeholder="请输入角色编码">
                </div>
            </div>
            <div class="row mb-3">
                <label class="col-sm-2 col-form-label">角色名称 <span class="text-danger">*</span></label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" name="role_name" required
                           value="{{ role.role_name if role else '' }}" placeholder="请输入角色名称">
                </div>
            </div>
            <div class="row mb-3">
                <label class="col-sm-2 col-form-label">数据权限范围</label>
                <div class="col-sm-10">
                    <select class="form-select" name="data_scope">
                        {% for label, value in get_dict_items('data_scope') %}
                        <option value="{{ value }}" {% if role and role.data_scope == value %}selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="row mb-3">
                <label class="col-sm-2 col-form-label">排序号</label>
                <div class="col-sm-10">
                    <input type="number" class="form-control" name="sort" min="0"
                           value="{{ role.sort if role else 0 }}" placeholder="数字越小越靠前">
                </div>
            </div>
            <div class="row mb-3">
                <label class="col-sm-2 col-form-label">备注</label>
                <div class="col-sm-10">
                    <textarea class="form-control" name="remark" rows="3"
                              placeholder="请输入备注信息">{{ role.remark if role else '' }}</textarea>
                </div>
            </div>
            <div class="row">
                <div class="col-sm-10 offset-sm-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-lg me-1"></i>保存
                    </button>
                    <a href="{{ url_for('system.roles') }}" class="btn btn-secondary ms-2">
                        <i class="bi bi-x-lg me-1"></i>取消
                    </a>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
