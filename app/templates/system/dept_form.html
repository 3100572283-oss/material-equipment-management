{% extends "base.html" %}
{% block title %}{{ '编辑部门' if dept else '新增部门' }} - 物资设备管理系统{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item"><a href="{{ url_for('system.depts') }}">部门管理</a></li>
            <li class="breadcrumb-item active">{{ '编辑部门' if dept else '新增部门' }}</li>
        </ol>
    </nav>
    <a href="{{ url_for('system.depts') }}" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left me-1"></i>返回
    </a>
</div>

<div class="card shadow-sm">
    <div class="card-header bg-white">
        <h6 class="mb-0"><i class="bi bi-building me-2"></i>{{ '编辑部门' if dept else '新增部门' }}</h6>
    </div>
    <div class="card-body">
        <form method="POST" action="">
            <div class="row mb-3">
                <label class="col-sm-2 col-form-label">部门名称 <span class="text-danger">*</span></label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" name="dept_name" required
                           value="{{ dept.dept_name if dept else '' }}" placeholder="请输入部门名称">
                </div>
            </div>
            <div class="row mb-3">
                <label class="col-sm-2 col-form-label">部门编码 <span class="text-danger">*</span></label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" name="dept_code" required
                           value="{{ dept.dept_code if dept else '' }}" placeholder="请输入部门编码">
                </div>
            </div>
            <div class="row mb-3">
                <label class="col-sm-2 col-form-label">上级部门</label>
                <div class="col-sm-10">
                    <select class="form-select" name="parent_id">
                        <option value="0">无（一级部门）</option>
                        {% for d in all_depts %}
                            {% if not dept or d.id != dept.id %}
                            <option value="{{ d.id }}" {% if dept and dept.parent_id == d.id %}selected{% endif %}>
                                {% if d.parent_id != 0 %}└─ {% endif %}{{ d.dept_name }}
                            </option>
                            {% endif %}
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="row mb-3">
                <label class="col-sm-2 col-form-label">排序号</label>
                <div class="col-sm-10">
                    <input type="number" class="form-control" name="sort" min="0"
                           value="{{ dept.sort if dept else 0 }}" placeholder="数字越小越靠前">
                </div>
            </div>
            <div class="row mb-3">
                <label class="col-sm-2 col-form-label">备注</label>
                <div class="col-sm-10">
                    <textarea class="form-control" name="remark" rows="3"
                              placeholder="请输入备注信息">{{ dept.remark if dept else '' }}</textarea>
                </div>
            </div>
            <div class="row">
                <div class="col-sm-10 offset-sm-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-lg me-1"></i>保存
                    </button>
                    <a href="{{ url_for('system.depts') }}" class="btn btn-secondary ms-2">
                        <i class="bi bi-x-lg me-1"></i>取消
                    </a>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
