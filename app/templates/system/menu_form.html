{% extends "base.html" %}
{% block title %}{{ '编辑菜单' if menu else '新增菜单' }} - 物资设备管理系统{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item"><a href="{{ url_for('system.menus') }}">菜单管理</a></li>
            <li class="breadcrumb-item active">{{ '编辑菜单' if menu else '新增菜单' }}</li>
        </ol>
    </nav>
    <a href="{{ url_for('system.menus') }}" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left me-1"></i>返回
    </a>
</div>

<div class="card shadow-sm">
    <div class="card-header bg-white">
        <h6 class="mb-0"><i class="bi bi-menu-button-wide me-2"></i>{{ '编辑菜单' if menu else '新增菜单' }}</h6>
    </div>
    <div class="card-body">
        <form method="POST" action="">
            <div class="row mb-3">
                <label class="col-sm-2 col-form-label">菜单名称 <span class="text-danger">*</span></label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" name="menu_name" required
                           value="{{ menu.menu_name if menu else '' }}" placeholder="请输入菜单名称">
                </div>
            </div>
            <div class="row mb-3">
                <label class="col-sm-2 col-form-label">上级菜单</label>
                <div class="col-sm-10">
                    <select class="form-select" name="parent_id">
                        <option value="0">无（一级菜单）</option>
                        {% for m in all_menus %}
                            {% if not menu or m.id != menu.id %}
                            <option value="{{ m.id }}" {% if menu and menu.parent_id == m.id %}selected{% endif %}>
                                {% if m.parent_id != 0 %}└─ {% endif %}{{ m.menu_name }}
                            </option>
                            {% endif %}
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="row mb-3">
                <label class="col-sm-2 col-form-label">菜单类型</label>
                <div class="col-sm-10">
                    <select class="form-select" name="menu_type">
                        <option value="catalog" {% if menu and menu.menu_type == 'catalog' %}selected{% endif %}>目录</option>
                        <option value="menu" {% if menu and menu.menu_type == 'menu' %}selected{% endif %}>菜单</option>
                        <option value="button" {% if menu and menu.menu_type == 'button' %}selected{% endif %}>按钮</option>
                    </select>
                </div>
            </div>
            <div class="row mb-3">
                <label class="col-sm-2 col-form-label">菜单编码</label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" name="menu_code"
                           value="{{ menu.menu_code if menu else '' }}" placeholder="请输入菜单编码">
                </div>
            </div>
            <div class="row mb-3">
                <label class="col-sm-2 col-form-label">路由路径</label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" name="path"
                           value="{{ menu.path if menu else '' }}" placeholder="如 /stock/in">
                </div>
            </div>
            <div class="row mb-3">
                <label class="col-sm-2 col-form-label">图标</label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" name="icon"
                           value="{{ menu.icon if menu else '' }}" placeholder="如 bi-box">
                </div>
            </div>
            <div class="row mb-3">
                <label class="col-sm-2 col-form-label">权限标识</label>
                <div class="col-sm-10">
                    <input type="text" class="form-control" name="permission"
                           value="{{ menu.permission if menu else '' }}" placeholder="如 stock:in:add">
                </div>
            </div>
            <div class="row mb-3">
                <label class="col-sm-2 col-form-label">排序号</label>
                <div class="col-sm-10">
                    <input type="number" class="form-control" name="sort" min="0"
                           value="{{ menu.sort if menu else 0 }}" placeholder="数字越小越靠前">
                </div>
            </div>
            <div class="row mb-3">
                <label class="col-sm-2 col-form-label">备注</label>
                <div class="col-sm-10">
                    <textarea class="form-control" name="remark" rows="3"
                              placeholder="请输入备注信息">{{ menu.remark if menu else '' }}</textarea>
                </div>
            </div>
            <div class="row">
                <div class="col-sm-10 offset-sm-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-lg me-1"></i>保存
                    </button>
                    <a href="{{ url_for('system.menus') }}" class="btn btn-secondary ms-2">
                        <i class="bi bi-x-lg me-1"></i>取消
                    </a>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
