{% extends "base.html" %}
{% block title %}新建报废单 - 物资设备管理系统{% endblock %}
{% block content %}
<div class="card shadow-sm">
    <div class="card-header bg-white d-flex justify-content-between align-items-center">
        <h5 class="mb-0"><i class="bi bi-trash3 me-2"></i>新建报废单</h5>
        <span class="text-muted small">单号：{{ default_code }}（保存后生效）</span>
    </div>
    <div class="card-body">
        <form method="POST" id="scrapForm">
            <div class="row g-3 mb-3">
                <div class="col-md-3">
                    <label class="form-label">报废日期 <span class="text-danger">*</span></label>
                    <input type="date" class="form-control" name="scrap_date" value="{{ today }}" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">用料单位</label>
                    <select class="form-select" name="usage_unit_id">
                        <option value="">-- 请选择 --</option>
                        {% for u in usage_units %}
                        <option value="{{ u.id }}">{{ u.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">报废原因 <span class="text-danger">*</span></label>
                    <select class="form-select" name="reason" required>
                        {% for value, label in reason_labels.items() %}
                        <option value="{{ value }}" {% if value == 'other' %}selected{% endif %}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">备注</label>
                    <input type="text" class="form-control" name="remark" placeholder="报废备注说明">
                </div>
            </div>

            <h6 class="mb-2"><i class="bi bi-list-ul me-1"></i>报废明细</h6>
            <div class="table-responsive">
                <table class="table table-bordered align-middle" id="itemsTable">
                    <thead class="table-light">
                        <tr>
                            <th style="width:28%">物资</th>
                            <th>规格型号</th>
                            <th>单位</th>
                            <th>批次号</th>
                            <th style="width:10%" class="text-end">数量</th>
                            <th style="width:12%" class="text-end">单价</th>
                            <th style="width:12%" class="text-end">金额</th>
                            <th style="width:18%">明细原因</th>
                            <th style="width:60px">操作</th>
                        </tr>
                    </thead>
                    <tbody id="itemsBody"></tbody>
                    <tfoot>
                        <tr class="table-total-row">
                            <td colspan="4" class="text-end total-label">合计</td>
                            <td class="text-end total-qty" id="totalQty">0</td>
                            <td></td>
                            <td class="text-end total-value" id="totalAmount">0.00</td>
                            <td colspan="2"></td>
                        </tr>
                    </tfoot>
                </table>
            </div>
            <div class="d-grid d-md-block mt-2 mb-3">
                <button type="button" class="btn btn-outline-primary" id="addRowBtn"><i class="bi bi-plus-lg me-1"></i>添加明细行</button>
            </div>

            <hr class="my-4">

            <div class="mb-3">
                <label class="form-label">现场照片（最多6张）</label>
                <input type="file" class="form-control" name="photos[]" accept="image/*" multiple>
                <small class="text-muted">支持多张照片上传，可记录现场情况</small>
            </div>

            <div class="form-actions">
                <a href="{{ url_for('scrap.index') }}" class="btn btn-secondary">返回</a>
                <button type="submit" class="btn btn-outline-primary" name="action" value="save">
                    <i class="bi bi-check-lg me-1"></i>保存
                </button>
                <button type="submit" class="btn btn-primary" name="action" value="submit">
                    <i class="bi bi-send me-1"></i>提交
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
const materialsOptions = `{% for m in materials %}<option value="{{ m.id }}" data-spec="{{ m.specification or '' }}" data-unit="{{ m.unit }}">{{ m.name }} - {{ m.specification or '-' }} - {{ m.unit }}</option>{% endfor %}`;

function buildRow() {
    const tr = document.createElement('tr');
    tr.innerHTML = `
        <td><select class="form-select form-select-sm material-select" name="material_id[]" required><option value="">-- 请选择 --</option>${materialsOptions}</select></td>
        <td><input type="text" class="form-control form-control-sm spec-cell" readonly></td>
        <td><input type="text" class="form-control form-control-sm unit-cell" readonly></td>
        <td><input type="text" class="form-control form-control-sm batch-input" name="batch_no[]" placeholder="无批次可留空"></td>
        <td><input type="number" step="0.0001" min="0" class="form-control form-control-sm text-end qty-input" name="quantity[]" value="0"></td>
        <td><input type="number" step="0.0001" min="0" class="form-control form-control-sm text-end price-input" name="unit_price[]" value="0"></td>
        <td><input type="text" class="form-control form-control-sm text-end amount-cell fw-bold" value="0.00" readonly></td>
        <td><input type="text" class="form-control form-control-sm reason-detail-input" name="reason_detail[]" placeholder="明细原因"></td>
        <td><button type="button" class="btn btn-sm btn-outline-danger" onclick="removeRow(this)"><i class="bi bi-trash"></i></button></td>
    `;
    return tr;
}

function addRow() {
    const tr = buildRow();
    document.getElementById('itemsBody').appendChild(tr);
    bindRowEvents(tr);
}

function removeRow(btn) {
    if (document.querySelectorAll('#itemsBody tr').length <= 1) {
        if (!confirm('至少保留一行明细，确认清空？')) return;
    }
    const tr = btn.closest('tr');
    tr.remove();
    recalc();
}

function recalc() {
    let tq = 0, ta = 0;
    document.querySelectorAll('#itemsBody tr').forEach(tr => {
        const q = parseFloat(tr.querySelector('.qty-input').value) || 0;
        const p = parseFloat(tr.querySelector('.price-input').value) || 0;
        const a = q * p;
        tr.querySelector('.amount-cell').value = a.toFixed(2);
        tq += q;
        ta += a;
    });
    document.getElementById('totalQty').textContent = tq.toFixed(4);
    document.getElementById('totalAmount').textContent = ta.toFixed(2);
}

function bindRowEvents(tr) {
    const sel = tr.querySelector('.material-select');
    sel.addEventListener('change', () => {
        const opt = sel.options[sel.selectedIndex];
        tr.querySelector('.spec-cell').value = opt ? opt.dataset.spec : '';
        tr.querySelector('.unit-cell').value = opt ? opt.dataset.unit : '';
    });
    tr.querySelector('.qty-input').addEventListener('input', recalc);
    tr.querySelector('.price-input').addEventListener('input', recalc);
}

document.getElementById('addRowBtn').addEventListener('click', addRow);
// 默认添加一行
addRow();
recalc();
</script>
{% endblock %}
