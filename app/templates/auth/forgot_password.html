<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>忘记密码 - 物资设备管理系统</title>
    <link href="{{ url_for("static", filename="vendor/bootstrap-5.3.2/css/bootstrap.min.css") }}" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for("static", filename="vendor/bootstrap-icons-1.11.1/font/bootstrap-icons.css") }}">
    <style>
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; padding: 0; }
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4ecf7 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        .forgot-card {
            width: 100%;
            max-width: 410px;
            border: none;
            border-radius: 8px;
            box-shadow: 0 4px 24px rgba(22, 93, 255, 0.08);
            background: #fff;
            padding: 40px 32px;
        }
        .forgot-icon {
            width: 56px; height: 56px;
            background: linear-gradient(135deg, #165DFF 0%, #0a3d99 100%);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 28px; margin: 0 auto 16px;
        }
        .forgot-title { font-size: 20px; font-weight: 600; text-align: center; margin-bottom: 4px; }
        .forgot-subtitle { font-size: 13px; color: #86909c; text-align: center; margin-bottom: 28px; }
        .info-item { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: #f7f8fa; border-radius: 6px; margin-bottom: 10px; font-size: 14px; color: #4e5969; }
        .info-item i { color: #165DFF; font-size: 18px; }
        .back-link { display: block; text-align: center; margin-top: 20px; color: #165DFF; text-decoration: none; font-size: 14px; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="forgot-card">
        <div class="forgot-icon"><i class="bi bi-key"></i></div>
        <h1 class="forgot-title">找回密码</h1>
        <p class="forgot-subtitle">请联系系统管理员协助重置密码</p>

        <div class="info-item">
            <i class="bi bi-person-gear"></i>
            <span>管理员可在「系统管理 > 用户管理」中重置用户密码</span>
        </div>
        <div class="info-item">
            <i class="bi bi-shield-lock"></i>
            <span>重置后首次登录需强制修改密码</span>
        </div>
        <div class="info-item">
            <i class="bi bi-info-circle"></i>
            <span>密码要求：至少8位，需包含大小写字母和数字</span>
        </div>

        <a href="{{ url_for('auth.login') }}" class="back-link">
            <i class="bi bi-arrow-left"></i> 返回登录
        </a>
    </div>
</body>
</html>
